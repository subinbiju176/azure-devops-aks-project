apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsapp
  template:
    metadata:
      labels:
        app: devopsapp
    spec:
      containers:
      - name: devopsapp
        image: devopsaksacr123.azurecr.io/devopsapp:v1
        ports:
        - containerPort: 5000